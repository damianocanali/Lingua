name: lingua
description: "Lingua - A fun Italian learning app for kids"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.4
  audioplayers: ^6.1.0
  confetti: ^0.8.0
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  auto_size_text: ^3.0.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
